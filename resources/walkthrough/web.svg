<text x="162" y="190" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="var(--vscode-editorHoverWidget-foreground, #cccccc)" xml:space="preserve">Double quote to prevent globbing</text>
<text x="162" y="209" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" fill="var(--vscode-descriptionForeground, #9d9d9d)" xml:space="preserve">and word splitting.  shellcheck(SC2086)</text>
</g>
<text x="492" y="311" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" text-anchor="end" fill="var(--vscode-statusBar-foreground, #cccccc)" xml:space="preserve">Shell Script</text>
