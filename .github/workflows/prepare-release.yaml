name: prepare-release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (leave empty to infer from commits)
        required: false

permissions:
  contents: read

jobs:
  prepare-release:
    if: github.ref == 'refs/heads/master'

    runs-on: ubuntu-latest

    steps:
      # Pushing with a PAT so the release PR triggers CI; a PR opened with
      # GITHUB_TOKEN runs no workflows.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN_SEMANTIC_RELEASE }}
      - name: Setup Mise, Node and NPM
        uses: jdx/mise-action@v5
        with:
          version: 2026.9.17
      - run: npm ci
        env:
          BINDL_SKIP: "true"
      - name: Bump version and update CHANGELOG.md
        id: prepare
        run: echo "version=$(node scripts/release.mjs prepare "$VERSION")" >> "$GITHUB_OUTPUT"
        env:
          VERSION: ${{ inputs.version }}
      - name: Open release PR
        run: |
          branch="release/v$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -am "chore(release): $VERSION"
          git push origin "$branch"
          body=$(printf 'Merging this PR publishes v%s.\n\nEdit `CHANGELOG.md` and any release content on this branch before merging.\n\n%s\n' \
            "$VERSION" "$(node scripts/release.mjs notes "$VERSION")")
          gh pr create --base master --head "$branch" --title "chore(release): $VERSION" --body "$body"
        env:
          VERSION: ${{ steps.prepare.outputs.version }}
          GH_TOKEN: ${{ secrets.GH_TOKEN_SEMANTIC_RELEASE }}
