name: ci

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  # This is to catch new releases of VS Code which could cause the extension to break
  schedule:
    - cron: 0 0 * * *

permissions:
  contents: read # for checkout

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        vscode-version: ["1.119.0", stable]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7
      - name: Setup Mise, Node and NPM
        uses: jdx/mise-action@v5
        with:
          version: 2026.9.17
      - run: npm ci
        env:
          BINDL_CURRENT_ONLY: "true"
      - name: Test with VS Code ${{ matrix.vscode-version }}
        uses: GabrielBB/xvfb-action@v1
        env:
          VSCODE_TEST_VERSION: ${{ matrix.vscode-version }}
        with:
          run: npm test

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win32-x64
            npm_config_arch: x64
          - os: windows-latest
            target: win32-arm64
            npm_config_arch: arm64
          - os: ubuntu-latest
            target: linux-x64
            npm_config_arch: x64
          - os: ubuntu-latest
            target: linux-arm64
            npm_config_arch: arm64
          - os: ubuntu-latest
            target: linux-armhf
            npm_config_arch: arm
          - os: ubuntu-latest
            target: alpine-x64
            npm_config_arch: x64
          - os: ubuntu-latest
            target: alpine-arm64
            npm_config_arch: arm64
          - os: macos-latest
            target: darwin-x64
            npm_config_arch: x64
          - os: macos-latest
            target: darwin-arm64
            npm_config_arch: arm64
          - os: ubuntu-latest
            target: universal

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7
      - name: Setup Mise, Node and NPM
        uses: jdx/mise-action@v5
        with:
          version: 2026.9.17
      - if: matrix.target != 'universal'
        name: Install dependencies (with binaries)
        run: npm ci
        env:
          npm_config_arch: ${{ matrix.npm_config_arch }}
      - if: matrix.target == 'universal'
        name: Install dependencies (without binaries)
        run: npm ci
        env:
          BINDL_SKIP: "true"
      - run: npx vsce package ${{ matrix.target != 'universal' && format('--target {0}', matrix.target) || '' }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: "*.vsix"

  release:
    if: github.event_name != 'schedule'

    needs: [test, build]

    runs-on: ubuntu-latest

    # A later push must not publish while an earlier release is still running
    concurrency: release

    permissions:
      contents: write # to be able to publish a GitHub release

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - name: Setup Mise, Node and NPM
        uses: jdx/mise-action@v5
        with:
          version: 2026.9.17
      - run: npm ci
        env:
          BINDL_SKIP: "true"
      - run: npm audit signatures
      # Publish only from the merged release PR commit, i.e. the one that
      # bumped the version. Re-running this job is safe: registries skip
      # duplicates and the tag check stops a second GitHub release.
      - name: Check for release
        id: check
        if: github.event_name == 'push'
        run: |
          version=$(node -p "require('./package.json').version")
          previous=$(git show HEAD^:package.json | node -p "JSON.parse(require('fs').readFileSync(0)).version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$version" != "$previous" ] && ! git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish to Visual Studio Marketplace
        if: steps.check.outputs.release == 'true'
        run: bash .github/scripts/vsce-publish-with-retry.sh
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
      - name: Publish to Open VSX Registry
        if: steps.check.outputs.release == 'true'
        run: npx ovsx publish --skip-duplicate --packagePath *.vsix
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
      - name: Create GitHub release
        if: steps.check.outputs.release == 'true'
        run: |
          node scripts/release.mjs notes "$VERSION" > "$RUNNER_TEMP/notes.md"
          gh release create "v$VERSION" *.vsix --target "$GITHUB_SHA" --title "v$VERSION" --notes-file "$RUNNER_TEMP/notes.md"
        env:
          VERSION: ${{ steps.check.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
