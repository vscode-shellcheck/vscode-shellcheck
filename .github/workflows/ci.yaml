name: ci

on:
  push:
    branches:
      - master
  # Any base, so PRs stacked on another PR's branch get checked too.
  pull_request:
  # This is to catch new releases of VS Code which could cause the extension to break
  schedule:
    - cron: 0 0 * * *

permissions:
  contents: read # for checkout

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        vscode-version: ["1.119.0", stable]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7
      - name: Setup Mise, Node and NPM
        uses: jdx/mise-action@v5
        with:
          version: 2026.10.2
      - run: npm ci
        env:
          BINDL_CURRENT_ONLY: "true"
      - name: Test with VS Code ${{ matrix.vscode-version }}
        uses: GabrielBB/xvfb-action@v1
        env:
          VSCODE_TEST_VERSION: ${{ matrix.vscode-version }}
        with:
          run: npm test
      - if: matrix.os == 'ubuntu-latest' && matrix.vscode-version == 'stable'
        name: Test the localized UI
        uses: GabrielBB/xvfb-action@v1
        env:
          VSCODE_TEST_L10N: "true"
        with:
          run: npx vscode-test --label l10n-zh-cn
      # An extension host that dies on a signal leaves mocha with only
      # "Canceled"; the native stack is in the macOS crash report.
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-logs-${{ matrix.os }}-${{ matrix.vscode-version }}
          path: |
            ~/Library/Logs/DiagnosticReports/
            .vscode-test/user-data*/logs/
          if-no-files-found: ignore

  test-web:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Setup Mise, Node and NPM
        uses: jdx/mise-action@v5
        with:
          version: 2026.10.2
      - run: npm ci
      # The translations are keyed on these English sources.
      - run: npm run l10n:check
      - run: node .github/scripts/check-nls-keys.mjs
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run build:test:web
      - run: npm run test:web

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win32-x64
            npm_config_arch: x64
          - os: windows-latest
            target: win32-arm64
            npm_config_arch: arm64
          - os: ubuntu-latest
            target: linux-x64
            npm_config_arch: x64
          - os: ubuntu-latest
            target: linux-arm64
            npm_config_arch: arm64
          - os: ubuntu-latest
            target: linux-armhf
            npm_config_arch: arm
          - os: ubuntu-latest
            target: alpine-x64
            npm_config_arch: x64
          - os: ubuntu-latest
            target: alpine-arm64
            npm_config_arch: arm64
          - os: macos-latest
            target: darwin-x64
            npm_config_arch: x64
          - os: macos-latest
            target: darwin-arm64
            npm_config_arch: arm64
          - os: ubuntu-latest
            target: universal

    runs-on: ${{ matrix.os }}

    # Even though semantic-release will not publish anything, it still needs to
    # validate the GITHUB_TOKEN
    permissions:
      contents: write # to be able to publish a GitHub release
      issues: write # to be able to comment on released issues
      pull-requests: write # to be able to comment on released pull requests

    steps:
      - uses: actions/checkout@v7
      - name: Setup Mise, Node and NPM
        uses: jdx/mise-action@v5
        with:
          version: 2026.10.2
      - if: matrix.target != 'universal'
        name: Install dependencies (with binaries)
        run: npm ci
        env:
          npm_config_arch: ${{ matrix.npm_config_arch }}
      - if: matrix.target == 'universal'
        name: Install dependencies (without binaries)
        run: npm ci
        env:
          BINDL_SKIP: "true"
      - run: npx semantic-release --extends ./package.release.config.js
        env:
          VSCE_TARGET: ${{ matrix.target }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: "*.vsix"
      # vsce updates the version in package.json and package-lock.json during
      # package step, so we need to save them for the publish step
      - if: matrix.target == 'universal'
        uses: actions/upload-artifact@v7
        with:
          name: package-json
          path: |
            package.json
            package-lock.json

  release:
    # Only master releases; PRs stacked on other branches just run the checks.
    if: github.event_name != 'schedule' && (github.ref_name == 'master' || github.base_ref == 'master')

    needs: [test, test-web, build]

    runs-on: ubuntu-latest

    permissions:
      contents: write # to be able to publish a GitHub release
      issues: write # to be able to comment on released issues
      pull-requests: write # to be able to comment on released pull requests

    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GH_TOKEN_SEMANTIC_RELEASE || github.token }}
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - name: Setup Mise, Node and NPM
        uses: jdx/mise-action@v5
        with:
          version: 2026.10.2
      - run: npm ci
        env:
          BINDL_SKIP: "true"
      - run: npm audit signatures
      # Only run on push events or pull requests coming from the same repository, except from dependabot
      - name: Run semantic-release
        run: bash .github/scripts/semantic-release-with-vsce-retry.sh
        if: github.event_name == 'push' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
